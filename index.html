function buildShuffledOptions(correctText, distractors) {
  const unique = [];
  const seen = new Set([correctText.trim()]);
  for (const d of distractors) {
    const t = d.text.trim();
    if (!seen.has(t) && unique.length < 3) {
      seen.add(t);
      unique.push(d);
    }
  }
  let extra = 2;
  while (unique.length < 3) {
    const fallback = `${correctText} (+${extra})`;
    if (!seen.has(fallback)) {
      seen.add(fallback);
      unique.push({
        text: fallback,
        trapLabel: 'Calculation slip'
      });
    }
    extra += 2;
  }
  const pool = [{
    text: correctText,
    isCorrect: true,
    trapLabel: 'Correct Answer (सही उत्तर)'
  }, ...unique.map(d => ({
    text: d.text,
    isCorrect: false,
    trapLabel: d.trapLabel
  }))];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = pool[i];
    pool[i] = pool[j];
    pool[j] = tmp;
  }
  const ids = ['A', 'B', 'C', 'D'];
  let correctOptionId = 'A';
  const options = pool.map((p, idx) => {
    const id = ids[idx];
    if (p.isCorrect) correctOptionId = id;
    return {
      id,
      text: p.text,
      isCorrect: p.isCorrect,
      trapLabel: p.trapLabel
    };
  });
  return {
    options,
    correctOptionId
  };
}
function buildWordHelper(word) {
  const vowels = new Set(['A', 'E', 'I', 'O', 'U']);
  return word.toUpperCase().split('').map(ch => {
    const fwd = ch.charCodeAt(0) - 64;
    return {
      char: ch,
      fwd,
      rev: 27 - fwd,
      isVowel: vowels.has(ch)
    };
  });
}

      note: '3 letters on left, 3 letters on right'
    }, {

function App() {
  const [activeTab, setActiveTab] = useState('studio');
  const [darkMode, setDarkMode] = useState(true);
  // Default to single clean language ('hi' = Hinglish/Hindi or 'en' = English) so screen is never cluttered!
  const [langMode, setLangMode] = useState('hi');

  // Hub Filter State
  const [selectedPriorityFilter, setSelectedPriorityFilter] = useState('All');
  const [searchQuery, setSearchQuery] = useState('');
  const [showEvolutionTable, setShowEvolutionTable] = useState(false);

  // Studio State
  const [selectedArchetypeId, setSelectedArchetypeId] = useState('series-progression');
  const [subPatternFilter, setSubPatternFilter] = useState('all');
  const [currentVariation, setCurrentVariation] = useState(() => BPSC_ARCHETYPES[0].generateVariation('all'));
  const [selectedOptionId, setSelectedOptionId] = useState(null);
  const [studioEliminatedIds, setStudioEliminatedIds] = useState([]);
  const [showSolutionDrawer, setShowSolutionDrawer] = useState(false);
  const [showRoughPad, setShowRoughPad] = useState(false);

  // 60 Official PYQ Vault State
  const [pyqCycleFilter, setPyqCycleFilter] = useState('All');
  const [pyqTopicFilter, setPyqTopicFilter] = useState('All');
  const [pyqSearch, setPyqSearch] = useState('');
  const [pyqUserAnswers, setPyqUserAnswers] = useState({});
  const [pyqExpandedSolutions, setPyqExpandedSolutions] = useState({});

  // Mistake Bank
  const [mistakeBank, setMistakeBank] = useState([]);

  // Per-Topic Stats
  const [statsByArchetype, setStatsByArchetype] = useState(() => {
    const init = {};
    for (const a of BPSC_ARCHETYPES) {
      init[a.id] = {
        attempted: 0,
        correct: 0,
        incorrect: 0,
        streak: 0
      };
    }
    return init;
  });
  const activeArchetype = useMemo(() => BPSC_ARCHETYPES.find(a => a.id === selectedArchetypeId) || BPSC_ARCHETYPES[0], [selectedArchetypeId]);
  const activeArchetypeOfficialPyqs = useMemo(() => {
    return OFFICIAL_60_PYQS.filter(q => activeArchetype.linkedPyqTopics.includes(q.topic));
  }, [activeArchetype]);
  const openArchetypeInStudio = useCallback((archetypeId, forcedSub = 'all') => {
    const target = BPSC_ARCHETYPES.find(a => a.id === archetypeId) || BPSC_ARCHETYPES[0];
    setSelectedArchetypeId(target.id);
    setSubPatternFilter(forcedSub);
    setCurrentVariation(target.generateVariation(forcedSub));
    setSelectedOptionId(null);
    setStudioEliminatedIds([]);
    setShowSolutionDrawer(false);
    setActiveTab('studio');
  }, []);
  const handleGenerateNextVariation = useCallback(() => {
    setCurrentVariation(activeArchetype.generateVariation(subPatternFilter));
    setSelectedOptionId(null);
    setStudioEliminatedIds([]);
    setShowSolutionDrawer(false);
  }, [activeArchetype, subPatternFilter]);
  const handleChangeSubPattern = nextSub => {
    setSubPatternFilter(nextSub);
    setCurrentVariation(activeArchetype.generateVariation(nextSub));
    setSelectedOptionId(null);
    setStudioEliminatedIds([]);
    setShowSolutionDrawer(false);
  };
  const handleSelectStudioOption = useCallback(optionId => {
    if (selectedOptionId !== null) return;
    setSelectedOptionId(optionId);
    setShowSolutionDrawer(true); // Automatically show the super-clean 3-step solution!

    const isRight = optionId === currentVariation.correctOptionId;
    if (!isRight) {
      const correctObj = currentVariation.options.find(o => o.id === currentVariation.correctOptionId);
      setMistakeBank(prev => [{
        id: `${currentVariation.variationId}-${Date.now()}`,
        topicTitle: activeArchetype.title,
        question: langMode === 'en' ? currentVariation.questionEn : currentVariation.questionHi,
        yourPick: optionId,
        correctKey: `(${currentVariation.correctOptionId}) ${correctObj?.text || ''}`,
        quickFix: langMode === 'en' ? currentVariation.oneLineTrickEn : currentVariation.oneLineTrickHi
      }, ...prev.slice(0, 29)]);
    }
    setStatsByArchetype(prev => {
      const curr = prev[activeArchetype.id] || {
        attempted: 0,
        correct: 0,
        incorrect: 0,
        streak: 0
      };
      return {
        ...prev,
        [activeArchetype.id]: {
          attempted: curr.attempted + 1,
          correct: curr.correct + (isRight ? 1 : 0),
          incorrect: curr.incorrect + (isRight ? 0 : 1),
          streak: isRight ? curr.streak + 1 : 0
        }
      };
    });
  }, [selectedOptionId, currentVariation, activeArchetype, langMode]);
  const globalMetrics = useMemo(() => {
    let attempted = 0;
    let correct = 0;
    let incorrect = 0;
    for (const a of BPSC_ARCHETYPES) {
      const s = statsByArchetype[a.id];
      if (s) {
        attempted += s.attempted;
        correct += s.correct;
        incorrect += s.incorrect;
      }
    }
    const pyqAttemptedCount = Object.keys(pyqUserAnswers).length;
    for (const q of OFFICIAL_60_PYQS) {
      const u = pyqUserAnswers[q.qNo];
      if (u) {
        attempted += 1;
        if (u === q.correctOptionId) correct += 1;else incorrect += 1;
      }
    }
    const netScore = +(correct * 1.0 - incorrect * (1 / 3)).toFixed(2);
    return {
      attempted,
      correct,
      incorrect,
      netScore,
      pyqAttemptedCount
    };
  }, [statsByArchetype, pyqUserAnswers]);

  // ============================================================================
  // 8. SPRINT ENGINE
  // ============================================================================

  const [sprintStatus, setSprintStatus] = useState('idle');
  const [sprintSourceMode, setSprintSourceMode] = useState('DYNAMIC_2025');
  const [sprintPenaltyRate, setSprintPenaltyRate] = useState(1 / 3);
  const [sprintQuestions, setSprintQuestions] = useState([]);
