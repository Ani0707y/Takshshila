        questionText: `Find the missing number (?) in the 3×3 matrix: Row 1: [${r1c1}, ${r1c2}, ${r1c3}]; Row 2: [${r2c1}, ?, ${r2c3}]; Row 3: [${r3c1}, ${r3c2}, ${r3c3}]`,

        options,

        shortcutFormulaLatex: `\text{Col}_2 = \left( \frac{\text{Col}_1}{\text{Col}_3} \right) \times ${k}`,
        substitutionLatex: `? = \left( \frac{${r2c1}}{${r2c3}} \right) \times ${k} = ${q2} \times ${k} = ${ans}`,

          labelB: `? = ${ans}`

  if (chosenSub === 'C') {
    // Sub-Type C: Arithmetic Progression n-th term (70th BPSC Q.109 Pattern)

    const {

    } = buildShuffledOptions(`${tn}`, [{
      text: `${wrongNTrap}`,

    }, {
      text: `${signTrap}`,
      trapLabel: `Common Difference Sign Trap: Inverted the sign of d = ${d}.`
    }, {
      text: `${tn - d}`,
      trapLabel: `Found T_${n - 1} instead of T_${n}.`
    }]);
    return {
      variationId: makeVariationId('AP-C'),
      archetypeId: 'series-progression',
      subTypeCode: 'C',
      subTypeTitle: 'Type C: Arithmetic Progression n-th Term (70th BPSC Q.109 Pattern)',
      questionText: `What is the ${n}th term of the arithmetic sequence: ${seqPreview}, ...?`,
      questionTextHi: `समांतर श्रेणी (A.P.) ${seqPreview}, ... का ${n}वाँ पद क्या होगा?`,
      parameterBadges: [`First term a = ${a}`, `Diff d = ${d}`, `Find T_${n}`],
      options,
      correctOptionId,
      shortcutFormulaLatex: `T_n = a + (n - 1)d`,
      substitutionLatex: `T_{${n}} = ${a} + (${n} - 1) \times (${d}) = ${a} + (${(n - 1) * d}) = ${tn}`,
      optionEliminationTrick: `Careful with negative common difference d = ${d}: multiply (${n} - 1 = ${n - 1}) by (${d}) = ${(n - 1) * d}, then add ${a} to get ${tn}!`,
      optionEliminationTrickHi: `सार्व अंतर d = ${d} को (${n}-1 = ${n - 1}) से गुणा करें (${(n - 1) * d}) और प्रथम पद ${a} जोड़ें = ${tn}!`,
      steps: [{
        title: 'Step 1: Identify First Term (a) and Common Difference (d)',
        titleHi: 'चरण 1: प्रथम पद (a) और सार्व अंतर (d) लिखें',
        explanation: `a = ${a}, and d = T₂ - T₁ = ${a + d} - ${a} = ${d}:`,

        latex: `T_{${n}} = ${a} + ${n - 1} \times (${d}) = ${tn}`
      }],
      proTip: `In 70th BPSC Q.109 (14, 10, 6, 2...), many students used +4 instead of -4 and lost -0.33 marks!`,
      proTipHi: `घटती हुई श्रेणी में d का ऋणात्मक चिह्न (-) लगाना कभी न भूलें!`,

        labelB: `(n-1)d = ${(n - 1) * d}`,
        labelC: `T_${n} = ${tn}`
      }
    };
  }

  // Sub-Type B: Consecutive Product n(n+1) Series (69th BPSC Q.145 Pattern)
  const baseN = randomPick([8, 9, 10, 11, 12]);
  const terms = [0, 1, 2, 3, 4, 5].map(offset => (baseN + offset) * (baseN + offset + 1));

    text: `${nMid * nMid}`,
    trapLabel: `Pure Square Trap: Picked ${nMid}² = ${nMid * nMid} instead of ${nMid} × ${nMid + 1} = ${missingVal}.`
  }, {
    text: `${missingVal + 4}`,
    trapLabel: `Difference Arithmetic Slip.`
  }, {
    text: `${missingVal - 6}`,
    trapLabel: `Constant Gap Assumption.`
  }]);
  return {
    variationId: makeVariationId('SER-B'),
    archetypeId: 'series-progression',
    subTypeCode: 'B',
    subTypeTitle: 'Type B: Consecutive Product n(n+1) / 2nd-Order Series (69th Q.145)',
    questionText: `What should come in place of '?' in the BPSC series: ${terms[0]}, ${terms[1]}, ?, ${terms[3]}, ${terms[4]}, ${terms[5]}`,
    questionTextHi: `दी गई BPSC संख्या श्रेणी में प्रश्नवाचक चिह्न (?) के स्थान पर क्या आएगा: ${terms[0]}, ${terms[1]}, ?, ${terms[3]}, ${terms[4]}, ${terms[5]}`,
    parameterBadges: [`69th BPSC Q.145 Pattern`, `n(n + 1) Products`, `1st Diffs: +${terms[1] - terms[0]}, +${missingVal - terms[1]}...`],
    options,
    correctOptionId,
    shortcutFormulaLatex: `T_k = n_k (n_k + 1) \quad \text{or} \quad \Delta_k = \Delta_{k-1} + 2`,

    optionEliminationTrick: `Notice gaps increase by +2 each step: (${terms[1]} - ${terms[0]} = +${terms[1] - terms[0]}), so next gap is +${missingVal - terms[1]} → ${terms[1]} + ${missingVal - terms[1]} = ${missingVal}!`,
    optionEliminationTrickHi: `क्रमागत अंतर +2 से बढ़ रहे हैं: पहला अंतर +${terms[1] - terms[0]}, अतः अगला अंतर +${missingVal - terms[1]} जोड़ने पर ${terms[1]} + ${missingVal - terms[1]} = ${missingVal}!`,
    steps: [{
      title: 'Step 1: Spot Consecutive Integer Products n(n+1) or Difference Pyramid',
      titleHi: 'चरण 1: क्रमागत संख्याओं का गुणनफल n(n+1) या अंतर पहचानें',
      explanation: `${baseN}×${baseN + 1}=${terms[0]}, ${baseN + 1}×${baseN + 2}=${terms[1]}, so next is ${nMid}×${nMid + 1}:`,
      explanationHi: `${baseN}×${baseN + 1}=${terms[0]}, ${baseN + 1}×${baseN + 2}=${terms[1]}, अतः अगला पद ${nMid}×${nMid + 1}:`,

/**
 * PRIORITY 1B: Coding-Decoding (Ranks, Vowel Reverse 27-pos, Half-Inversion, Symbols) (11.7% Share, 7 PYQs)
 */
function generateCodingDecodingVariation(subFilter = 'all') {
  const chosenSub = subFilter === 'all' ? randomPick(['A', 'B', 'C']) : subFilter;
  if (chosenSub === 'A') {
    // 69th BPSC Q.148 Pattern: Consonants = Forward Rank (A=1..Z=26), Vowels = Reverse Rank (27 - pos)
    const words = ['PATNA', 'BIHAR', 'GANGA', 'RAJGIR', 'SONPUR', 'BUXAR'];
    const targetWord = randomPick(words);
    const vowels = new Set(['A', 'E', 'I', 'O', 'U']);
    const codedParts = targetWord.split('').map(ch => {
      const fwd = ch.charCodeAt(0) - 64;
      return vowels.has(ch) ? 27 - fwd : fwd;
    });
    const correctCode = codedParts.join('');

    // Trap 1: All forward ranks
    const allFwdTrap = targetWord.split('').map(ch => ch.charCodeAt(0) - 64).join('');
    // Trap 2: All reverse ranks
    const allRevTrap = targetWord.split('').map(ch => 27 - (ch.charCodeAt(0) - 64)).join('');
    // Trap 3: Off by 1 on vowel reverse (26 - pos instead of 27 - pos)
    const forgot27Trap = targetWord.split('').map(ch => {
      const fwd = ch.charCodeAt(0) - 64;
      return vowels.has(ch) ? 26 - fwd : fwd;
    }).join('');
    const {
      options,
      correctOptionId
    } = buildShuffledOptions(correctCode, [{
      text: allFwdTrap,
      trapLabel: `All-Forward Trap: Used standard A=1, E=5, I=9, O=15, U=21 for vowels instead of Reverse Rank (27 - pos).`
    }, {
      text: forgot27Trap,
      trapLabel: `26-Minus-Rank Error: Computed reverse rank as (26 - pos) instead of (27 - pos).`
    }, {
      text: allRevTrap,
      trapLabel: `Inverted Rule Trap: Applied reverse rank to consonants as well.`
    }]);
    return {
      variationId: makeVariationId('COD-A'),
      archetypeId: 'coding-decoding',
      subTypeCode: 'A',
      subTypeTitle: 'Type A: Consonant Forward / Vowel Reverse (27 - Pos) (69th BPSC Q.148)',
      questionText: `In a BPSC code language, if 'GREAT' is coded as '718222620' and 'MONK' is coded as '13121411' (Consonants = Forward Rank, Vowels = Reverse Rank 27 - Pos), how will '${targetWord}' be coded?`,
      questionTextHi: `एक कूट भाषा में यदि 'GREAT' को '718222620' और 'MONK' को '13121411' लिखा जाता है (व्यंजन = सीधा क्रम, स्वर = विपरीत क्रम 27 - स्थान), तो उसी भाषा में '${targetWord}' को कैसे लिखा जाएगा?`,
      parameterBadges: [`69th BPSC Q.148 Pattern`, `Consonant = Pos`, `Vowel = 27 - Pos`],
      options,
      correctOptionId,
      shortcutFormulaLatex: `C \rightarrow \text{Pos}, \quad V \in \{A,E,I,O,U\} \rightarrow (27 - \text{Pos})`,
      substitutionLatex: `${targetWord.split('').join(' \cdot ')} \rightarrow ${codedParts.join(' \cdot ')} = ${correctCode}`,
      optionEliminationTrick: `Check only the FIRST letter '${targetWord[0]}' and LAST letter '${targetWord[targetWord.length - 1]}': '${targetWord[0]}' gives ${codedParts[0]} and '${targetWord[targetWord.length - 1]}' gives ${codedParts[codedParts.length - 1]}. Match prefix/suffix to eliminate 3 options in 4 seconds!`,
      optionEliminationTrickHi: `पूरा शब्द हल न करें! केवल पहले अक्षर (${targetWord[0]} → ${codedParts[0]}) और अंतिम अक्षर (${targetWord[targetWord.length - 1]} → ${codedParts[codedParts.length - 1]}) का अंक मिलाकर 4 सेकंड में विकल्प चुनें!`,
      steps: [{
        title: 'Step 1: Separate Consonants (Forward) and Vowels (27 - Forward)',
        titleHi: 'चरण 1: व्यंजन का सीधा मान और स्वर (A,E,I,O,U) का विपरीत मान (27 - क्रम) लिखें',
        explanation: `Map each letter of ${targetWord}:`,
        explanationHi: `${targetWord} के प्रत्येक अक्षर का कूट मान:`,
        latex: `${targetWord.split('').map((c, idx) => `${c}=${codedParts[idx]}`).join(',\ ')} \quad \Rightarrow \quad ${correctCode}`
      }],
      proTip: `Memorize the 5 Vowel Reverse Ranks forever: A=26, E=22, I=18, O=12, U=6!`,
      proTipHi: `5 स्वरों के विपरीत क्रम हमेशा के लिए कंठस्थ कर लें: A=26, E=22, I=18, O=12, U=6!`,
      diagram: {
        kind: 'alphabet-rank',
        primaryValue: codedParts[0],
        secondaryValue: codedParts[codedParts.length - 1],
        highlightWord: targetWord,
        labelA: `Vowels (A=26,E=22,I=18,O=12,U=6)`,
        labelB: `Code: ${correctCode}`
      }
    };
  }

  // Sub-Type B: 6-Letter Half-Word Inversion (70th BPSC Re-Exam Q.97 CIRCLE -> RICELC)
  const sixLetterWords = ['MARKET', 'SILVER', 'PLANET', 'GARDEN', 'CUSTOM', 'TEMPLE'];
  const word = randomPick(sixLetterWords);
  const firstHalfRev = word.slice(0, 3).split('').reverse().join('');
  const secondHalfRev = word.slice(3, 6).split('').reverse().join('');
  const correctAns = firstHalfRev + secondHalfRev;
  const fullRevTrap = word.split('').reverse().join('');
  const swappedHalvesTrap = word.slice(3, 6) + word.slice(0, 3);
  const partialTrap = firstHalfRev + word.slice(3, 6);
  const {
    options,
    correctOptionId
  } = buildShuffledOptions(correctAns, [{
    text: fullRevTrap,
    trapLabel: `Full Word Reversal Trap: Reversed all 6 letters (${fullRevTrap}) instead of reversing the two 3-letter halves independently.`
  }, {
    text: swappedHalvesTrap,
    trapLabel: `Half-Swap Without Reversal: Swapped the two halves without reversing letters.`
  }, {
    text: partialTrap,
    trapLabel: `Forgot Second-Half Reversal: Reversed first 3 letters (${firstHalfRev}) but left last 3 unchanged.`
  }]);
  return {
    variationId: makeVariationId('COD-B'),
    archetypeId: 'coding-decoding',
    subTypeCode: 'B',
    subTypeTitle: 'Type B: Half-Word Split Inversion (70th Re-Exam Q.97 Pattern)',
    questionText: `'CIRCLE' is related to 'RICELC' in the same way as '${word}' is related to:`,
    questionTextHi: `जिस प्रकार 'CIRCLE' का संबंध 'RICELC' से है, उसी प्रकार '${word}' का संबंध निम्नलिखित में से किससे है?`,
    parameterBadges: [`70th Re-Exam Q.97 Pattern`, `[1,2,3 | 4,5,6] → [3,2,1 | 6,5,4]`, `Split & Reverse`],
    options,
    correctOptionId,
    shortcutFormulaLatex: `L_1 L_2 L_3 \mid L_4 L_5 L_6 \quad \rightarrow \quad L_3 L_2 L_1 \mid L_6 L_5 L_4`,
    substitutionLatex: `\text{${word.slice(0, 3)}} \rightarrow \text{${firstHalfRev}}, \quad \text{${word.slice(3, 6)}} \rightarrow \text{${secondHalfRev}} \quad \Rightarrow \quad \text{${correctAns}}`,
    optionEliminationTrick: `Split ${word} into ${word.slice(0, 3)} | ${word.slice(3, 6)}. The 3rd letter '${word[2]}' must become the 1st letter, and the 6th letter '${word[5]}' must become the 4th letter!`,
    optionEliminationTrickHi: `शब्द को 3-3 अक्षरों के दो भागों (${word.slice(0, 3)} | ${word.slice(3, 6)}) में बाँटकर प्रत्येक भाग को उल्टा लिखें: ${firstHalfRev} + ${secondHalfRev} = ${correctAns}!`,
    steps: [{
      title: 'Step 1: Split 6-Letter Word into Two Equal Halves',
      titleHi: 'चरण 1: 6-अक्षर वाले शब्द को दो बराबर भागों में बाँटें',
      explanation: `First half = ${word.slice(0, 3)}, Second half = ${word.slice(3, 6)}:`,
      explanationHi: `प्रथम अर्धांश = ${word.slice(0, 3)}, द्वितीय अर्धांश = ${word.slice(3, 6)}:`,
      latex: `\text{Reverse}(${word.slice(0, 3)}) + \text{Reverse}(${word.slice(3, 6)}) = \text{${correctAns}}`
    }],
    proTip: `Whenever letters in the code are an exact permutation (anagram) of the original word, number the positions 1-2-3-4-5-6!`,
    proTipHi: `जब कूट में मूल शब्द के ही अक्षर हों, तो तुरंत 1 से 6 तक क्रमांक डालकर स्थान परिवर्तन देखें!`,
    diagram: {
      kind: 'alphabet-rank',
      primaryValue: 3,
      secondaryValue: 6,
      highlightWord: word,
      labelA: `${word.slice(0, 3)} → ${firstHalfRev}`,
      labelB: `${word.slice(3, 6)} → ${secondHalfRev}`
    }
  };
}

/**
 * PRIORITY 2A: Odd One Out & Letter Step Uniformity (10% Share, 6 PYQs)
 */
function generateOddAnalogyVariation() {
  const stepSets = [{
    odd: 'PSVX',

/**

    }, {
      blocks: 6,
      extraLines: 1,
      desc: '2 diagonals and 1 vertical median (6 inner parts)',
      ans: 12,
      formula: '6 × 2 = 12'
    }, {
      blocks: 8,
      extraLines: 2,
      desc: '2 diagonals, 1 vertical median and 1 horizontal median (8 inner parts)',
      ans: 16,
      formula: '8 × 2 = 16'
    }];
    const cfg = randomPick(configs);
    const {
      options,
      correctOptionId
    } = buildShuffledOptions(`${cfg.ans} triangles`, [{
      text: `${cfg.blocks} triangles`,

    }]);
    return {
      variationId: makeVariationId('GEO-A'),

      options,
      correctOptionId,
      shortcutFormulaLatex: `\text{Total Triangles in Crossed Box} = 2 \times (\text{Number of Small Inner Triangles } n)`,
      substitutionLatex: `T = 2 \times ${cfg.blocks} = ${cfg.ans}\text{ triangles}`,
      optionEliminationTrick: `In any symmetric rectangle/square with both diagonals drawn, the total number of triangles is ALWAYS 2 × (number of small inner compartments) = 2 × ${cfg.blocks} = ${cfg.ans}!`,

      steps: [{
        title: 'Step 1: Number the Smallest Elementary Triangles Inside the Box',

        explanation: `There are n = ${cfg.blocks} elementary compartments:`,
        explanationHi: `कुल छोटे भाग n = ${cfg.blocks} हैं, अतः सूत्र 2n से:`,

      proTipHi: `दो अचूक सूत्र: (1) विकर्ण वाले आयत/वर्ग में n छोटे भाग हों तो कुल त्रिभुज = 2n; (2) शीर्ष से आधार पर रेखाएं हों तो n(n+1)/2!`,

    a: 13,
    d1Half: 5,
    d2Half: 12
  },

    parameterBadges: [`67th BPSC Q.147 Pattern`, `Side a = ${perim}/4 = ${tr.a}m`, `d₁/2 = ${tr.d1Half}m`],
    options,
    correctOptionId,
    shortcutFormulaLatex: `a = \frac{P}{4}, \quad \left(\frac{d_2}{2}\right)^2 = a^2 - \left(\frac{d_1}{2}\right)^2`,
    substitutionLatex: `a = ${tr.a},\ \frac{d_1}{2} = ${tr.d1Half} \quad \Rightarrow \quad \frac{d_2}{2} = \sqrt{${tr.a}^2 - ${tr.d1Half}^2} = ${tr.d2Half} \quad \Rightarrow \quad d_2 = 2 \times ${tr.d2Half} = ${d2}\text{ m}`,
    optionEliminationTrick: `Side a = ${perim}÷4 = ${tr.a} m, and half-diagonal = ${d1}÷2 = ${tr.d1Half} m. By Pythagorean triplet (${tr.d1Half}, ${tr.d2Half}, ${tr.a}), the other half-diagonal is ${tr.d2Half} m → Double it to get ${d2} m!`,
    optionEliminationTrickHi: `भुजा a = ${perim}/4 = ${tr.a} मी, आधा विकर्ण = ${tr.d1Half} मी। समकोण त्रिक (${tr.d1Half}, ${tr.d2Half}, ${tr.a}) से दूसरा आधा विकर्ण = ${tr.d2Half} मी → पूरा विकर्ण = 2 × ${tr.d2Half} = ${d2} मी!`,
    steps: [{

  };

/**
 * PRIORITY 3C: Ranking, Row Chair Count & Class Position (6.7% Share, 4 PYQs)
 */
function generateRankingOrderVariation() {
  const totalStudents = randomPick([39, 45, 50, 60]);
  const rankFromLast = randomPick([15, 17, 19, 22]);
  const aheadSteps = randomPick([5, 6, 7, 8]);
  const joginderFromStart = totalStudents - rankFromLast + 1;
  const nitinFromStart = joginderFromStart - aheadSteps;
  const forgotPlusOneTrap = totalStudents - rankFromLast - aheadSteps;
  const addedInsteadTrap = joginderFromStart + aheadSteps;
  const {
    options,
    correctOptionId
  } = buildShuffledOptions(`${nitinFromStart}th`, [{
    text: `${forgotPlusOneTrap}th`,
    trapLabel: `Forgot +1 Conversion Trap: Computed (${totalStudents} - ${rankFromLast}) - ${aheadSteps} = ${forgotPlusOneTrap}th, forgetting the +1 in Rank_start = Total - Rank_end + 1!`
  }, {
    text: `${joginderFromStart}th`,
    trapLabel: `Stopped at First Person Trap: Found Joginder's rank from start (${joginderFromStart}th) and forgot to subtract ${aheadSteps}.`
  }, {
    text: `${addedInsteadTrap}th`,
    trapLabel: `Direction Confusion Trap: Added +${aheadSteps} instead of subtracting ${aheadSteps} for "ahead".`
  }]);
  return {
    variationId: makeVariationId('RNK'),
    archetypeId: 'ranking-order',
    subTypeCode: 'A',
    subTypeTitle: 'Class Rank from Start/End Conversion (71st BPSC Q.6 Pattern)',
    questionText: `Nitin is ${aheadSteps} ranks ahead of Joginder in a class of ${totalStudents} students. If Joginder's rank is ${rankFromLast}th from the last, what is Nitin's rank from the beginning?`,

    optionEliminationTrick: `Never forget the +1 when converting from Bottom to Top! (${totalStudents} - ${rankFromLast} + 1) = ${joginderFromStart}th, then move ${aheadSteps} ranks closer to 1st → ${joginderFromStart} - ${aheadSteps} = ${nitinFromStart}th!`,
    optionEliminationTrickHi: `अंत से प्रारंभ का स्थान निकालते समय +1 जोड़ना कभी न भूलें: (${totalStudents} - ${rankFromLast} + 1) = ${joginderFromStart}वाँ, फिर ${aheadSteps} स्थान आगे = ${joginderFromStart} - ${aheadSteps} = ${nitinFromStart}वाँ!`,
    steps: [{
      title: 'Step 1: Convert Joginder’s Rank from Last to Beginning (+1 Rule)',
      titleHi: 'चरण 1: जोगिंदर का प्रारंभ से स्थान निकालें (+1 नियम)',
      explanation: `Rank from start = Total - Rank from end + 1:`,

      explanation: `"Ahead" means closer to Rank 1:`,

// Re-use our battle-tested Top 5 & Extended Generators for the remaining archetypes
function generateClockAndCalendarVariation(subFilter = 'all') {
  const chosenSub = subFilter === 'all' ? randomPick(['A', 'B', 'C']) : subFilter;
  if (chosenSub === 'A') {
    // 70th BPSC Re-Exam Q.42: Hands overlap between H and H+1 o'clock -> (60/11)*H mins past H
    const H = randomPick([2, 3, 4, 5, 7, 8]);
    const num = 60 * H;
    const whole = Math.floor(num / 11);
    const rem = num % 11;

    } = buildShuffledOptions(ansText, [{
      text: `${whole} ${rem}/43 mins past ${H}`,

    }, {
      text: `${5 * H} mins past ${H}`,

    }, {
      text: `${whole + 1} ${rem}/11 mins past ${H}`,
      trapLabel: `Division Quotient Slip.`
    }]);
    return {
      variationId: makeVariationId('CLK-OV'),
      archetypeId: 'clock-angle',
      subTypeCode: 'A',
      subTypeTitle: 'Type A: Clock Hand Coincidence Time (70th Re-Exam Q.42)',
      questionText: `At what exact time between ${H} o'clock and ${H + 1} o'clock will the hour hand and minute hand of a clock coincide (be together at 0°)?`,

      parameterBadges: [`70th Re-Exam Q.42 Pattern`, `M = (60/11) × H`, `Sum of digits rule`],
      options,
      correctOptionId,
      shortcutFormulaLatex: `M = \frac{60}{11} \times H \text{ minutes past } H`,
      substitutionLatex: `M = \frac{60 \times ${H}}{11} = \frac{${num}}{11} = ${whole}\frac{${rem}}{11}\text{ mins past } ${H}`,
      optionEliminationTrick: `2-Second BPSC Trick: In ANY valid clock overlap mixed fraction "X y/11", the denominator is ALWAYS 11, and (last digit of X + numerator y) ALWAYS equals 10! Here: (${whole % 10} + ${rem} = 10)!`,
      optionEliminationTrickHi: `2-सेकंड ट्रिक: घड़ी के संपाती होने के समय में बटे में हमेशा 11 होता है, और पूर्णांक के इकाई अंक (${whole % 10}) तथा अंश (${rem}) का योग हमेशा 10 होता है (${whole % 10} + ${rem} = 10)!`,
      steps: [{
        title: 'Step 1: Set θ = 0° in |30H - (11/2)M| = 0',
        titleHi: 'चरण 1: संपाती होने के लिए θ = 0° रखें',
        explanation: `Solving 11M/2 = 30H gives M = 60H/11:`,
        explanationHi: `सूत्र M = (60/11) × H में H = ${H} रखने पर:`,
        latex: `M = \frac{60 \times ${H}}{11} = ${whole}\frac{${rem}}{11}\text{ minutes past } ${H}`
      }],
      proTip: `Also remember 70th BPSC Q.121: Clock hands coincide 11 times in 12 hours and 22 times in 24 hours!`,
      proTipHi: `70वीं BPSC Q.121 भी याद रखें: घड़ी की सुइयाँ 12 घंटे में 11 बार और 24 घंटे में 22 बार मिलती हैं!`,
      diagram: {
        kind: 'clock',
        primaryValue: H,
        secondaryValue: whole,
        labelA: `${H}:${whole}`,
        labelB: `Overlap = ${whole} ${rem}/11m`
      }
    };
  }
  if (chosenSub === 'B') {
    // 70th BPSC Q.78 & Re-Exam Q.105: Leap-Year Calendar Odd Days
    const leapYears = [1996, 2004, 2008, 2012, 2016, 2024];
    const yr = randomPick(leapYears);
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    const daysHi = {
      Monday: 'सोमवार',
      Tuesday: 'मंगलवार',
      Wednesday: 'बुधवार',
      Thursday: 'गुरुवार',
      Friday: 'शुक्रवार',
      Saturday: 'शनिवार',
      Sunday: 'रविवार'
    };
    const allWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const startIdx = randomPick([0, 1, 2, 3, 4]);
    const startDay = allWeek[startIdx];
    const ansDay = allWeek[(startIdx + 2) % 7]; // Leap year = +2 odd days!
    const normalYearTrap = allWeek[(startIdx + 1) % 7];
    const {
      options,
      correctOptionId
    } = buildShuffledOptions(ansDay, [{
      text: normalYearTrap,
      trapLabel: `Non-Leap Year Trap (+1 Day): Added only +1 odd day as if ${yr} were a 365-day normal year, forgetting Feb 29 in leap year ${yr}!`
    }, {
      text: allWeek[(startIdx + 3) % 7],
      trapLabel: `Added +3 Odd Days instead of +2.`
    }, {
      text: startDay,
      trapLabel: `Zero Odd Day Assumption.`
    }]);
    return {
      variationId: makeVariationId('CAL-B'),
      archetypeId: 'clock-angle',
      subTypeCode: 'B',
      subTypeTitle: 'Type B: Leap-Year Calendar Odd-Days Trap (70th Q.78 & Re Q.105)',
      questionText: `If January 1, ${yr} falls on a ${startDay}, what day of the week will lie on January 1, ${yr + 1}?`,
      questionTextHi: `यदि 1 जनवरी, ${yr} को ${daysHi[startDay]} है, तो 1 जनवरी, ${yr + 1} को सप्ताह का कौन-सा दिन होगा?`,
      parameterBadges: [`70th Re-Exam Q.105 Pattern`, `${yr} is Leap Year (366d)`, `+2 Odd Days`],
      options,
      correctOptionId,
      shortcutFormulaLatex: `\text{Normal Yr (365d)} \rightarrow +1\text{ Odd Day}, \quad \text{Leap Yr (366d)} \rightarrow +2\text{ Odd Days}`,
      substitutionLatex: `\text{Jan 1, ${yr + 1}} = \text{${startDay}} + 2\text{ days (Feb 29 included)} = \text{${ansDay}}`,
      optionEliminationTrick: `Check if ${yr} is divisible by 4: ${yr} ÷ 4 = ${yr / 4} (Exact!). So ${yr} is a Leap Year (366 days = 52 weeks + 2 odd days). Advance ${startDay} by +2 days → ${ansDay}!`,
      optionEliminationTrickHi: `${yr} में 4 का पूरा भाग जाता है, अतः यह अधिवर्ष (Leap Year = 366 दिन) है। इसलिए +1 के बजाय +2 विषम दिन जोड़ें: ${daysHi[startDay]} + 2 = ${daysHi[ansDay]}!`,
      steps: [{
        title: `Step 1: Verify Leap Year Status of ${yr}`,
        titleHi: `चरण 1: जांचें कि ${yr} लीप वर्ष (अधिवर्ष) है`,
        explanation: `Since ${yr} includes Feb 29, total days = 366 ≡ 2 (mod 7):`,
        explanationHi: `366 को 7 से भाग देने पर 2 विषम दिन शेष बचते हैं:`,
        latex: `366 \div 7 = 52\text{ weeks} + 2\text{ odd days} \quad \Rightarrow \quad \text{${startDay}} + 2 = \text{${ansDay}}`
      }],
      proTip: `BPSC asked the Leap Year Feb 29 trap in BOTH 70th Dec 2024 (Q.78: 1996) and 70th Jan 2025 Re-Exam (Q.105: 2008)!`,
      proTipHi: `BPSC ने 70वीं PT और पुनर्परीक्षा दोनों में लीप वर्ष (1996 और 2008) का यह 29 फरवरी वाला जाल पूछा है!`,
      diagram: {
        kind: 'work-bar',
        primaryValue: 364,
        secondaryValue: 20,
        labelA: `52 Weeks (364d)`,
        labelB: `+2 Odd Days`,
        labelC: `${startDay} + 2 = ${ansDay}`
      }
    };
  }

  // Sub-Type C: Clock Angle |30H - 11/2 M|
  const H = randomPick([2, 3, 4, 5, 7, 8, 9]);
  const M = randomPick([12, 16, 20, 24, 28, 32, 36, 40]);
  const rawDiff = Math.abs(30 * H - 11 * M / 2);
  const acute = rawDiff > 180 ? 360 - rawDiff : rawDiff;
  const staticTrap = Math.abs(30 * H - 6 * M);
  const {
    options,
    correctOptionId
  } = buildShuffledOptions(`${acute}°`, [{
    text: `${staticTrap}°`,
    trapLabel: `Static Hour-Hand Trap: Forgot the ${M / 2}° hour-hand movement.`
  }, {
    text: `${360 - acute}°`,
    trapLabel: `Reflex Angle Trap.`
  }, {
    text: `${acute + 10}°`,
    trapLabel: `Arithmetic Slip.`
  }]);
  return {
    variationId: makeVariationId('CLK-C'),
    archetypeId: 'clock-angle',
    subTypeCode: 'C',
    subTypeTitle: 'Type C: Clock Hands Angle |30H - 11/2 M|',
    questionText: `What is the smaller angle (in degrees) between the hour hand and the minute hand at ${H}:${M}?`,
    questionTextHi: `${H} बजकर ${M} मिनट (${H}:${M}) पर घड़ी की दोनों सुइयों के बीच का छोटा कोण क्या होगा?`,
    parameterBadges: [`H = ${H}`, `M = ${M} (Even)`, `|30H - 5.5M|`],
    options,
    correctOptionId,
    shortcutFormulaLatex: `\theta = \left| 30H - \frac{11}{2}M \right|`,
    substitutionLatex: `\theta = \left| 30(${H}) - \frac{11}{2}(${M}) \right| = ${acute}^\circ`,
    optionEliminationTrick: `Halve M (${M}/2 = ${M / 2}) and multiply by 11 = ${11 * M / 2}°. Difference with ${30 * H}° is ${acute}°!`,
    optionEliminationTrickHi: `मिनट का आधा (${M / 2}) करके 11 से गुणा करें (${11 * M / 2}°) और 30H (${30 * H}°) से अंतर लें = ${acute}°!`,
    steps: [{
      title: 'Step 1: Apply |30H - 11/2 M|',
      titleHi: 'चरण 1: सूत्र |30H - 11/2 M| लगाएं',
      explanation: `Compute directly:`,
      explanationHi: `मान रखने पर:`,
      latex: `\theta = \left| ${30 * H} - ${11 * M / 2} \right| = ${acute}^\circ`
    }],
    proTip: `Every minute, the minute hand gains 5.5° (11/2°) over the hour hand.`,
    proTipHi: `प्रत्येक मिनट में मिनट की सुई घंटे की सुई से 5.5° (11/2°) अधिक चलती है।`,
    diagram: {
      kind: 'clock',
      primaryValue: H,
      secondaryValue: M,
      labelA: `${H}:${M}`,
      labelB: `θ = ${acute}°`
    }
  };
}

/**
 * PRIORITY 4A: Commercial Math (Lemon Unit Rate, Discount + GST, Invariance) (67th Q.145, 68th Q.143, 69th Q.143)
 */
function generateCommercialMathVariation(subFilter = 'all') {
  const chosenSub = subFilter === 'all' ? randomPick(['A', 'B', 'C']) : subFilter;
  if (chosenSub === 'A') {
    // 67th BPSC Q.145 Verbatim Pattern: Selling N1 lemons for Rs P1 loses L%. How many for Rs P2 to gain G%?
    const configs = [{
      N1: 45,
      P1: 40,
      L: 20,
      P2: 24,
      G: 20,
      ans: 18
    },
    // Exact 67th BPSC Q.145!
    {
      N1: 36,
      P1: 30,
      L: 20,
      P2: 20,
      G: 20,
      ans: 16
    }, {
      N1: 60,
      P1: 50,
      L: 10,
      P2: 30,
      G: 20,
      ans: 27
    }];
    const cfg = randomPick(configs);
    const {
      options,
      correctOptionId
    } = buildShuffledOptions(`${cfg.ans} lemons`, [{
      text: `${cfg.ans + 2} lemons`,
      trapLabel: `Ratio Inversion Trap: Inverted (100 - L)/(100 + G) on quantity.`
    }, {
      text: `${cfg.ans - 2} lemons`,
      trapLabel: `Arithmetic Slip in Unit Price.`
    }, {
      text: `${Math.round(cfg.N1 * cfg.P2 / cfg.P1)} lemons`,
      trapLabel: `Ignored Profit/Loss Shift: Scaled only by money (${cfg.P2}/${cfg.P1}) without adjusting for -${cfg.L}% to +${cfg.G}%.`
    }]);
    return {
      variationId: makeVariationId('COM-A'),
      archetypeId: 'price-consumption',
      subTypeCode: 'A',
      subTypeTitle: 'Type A: Unit Article Profit/Loss Rate (67th BPSC Q.145 Lemon Pattern)',
      questionText: `By selling ${cfg.N1} lemons for ₹${cfg.P1}, a vendor loses ${cfg.L}%. How many lemons should he sell for ₹${cfg.P2} to gain ${cfg.G}% in the transaction?`,
      questionTextHi: `₹${cfg.P1} में ${cfg.N1} नींबू बेचने पर एक विक्रेता को ${cfg.L}% की हानि होती है। 20% का लाभ कमाने के लिए उसे ₹${cfg.P2} में कितने नींबू बेचने चाहिए?`,
      parameterBadges: [`67th BPSC Q.145 Pattern`, `(P₁ / N₁) ÷ (100 - L)%`, `One-Line Chain`],
      options,
      correctOptionId,
      shortcutFormulaLatex: `\frac{P_1}{N_1 (100 - L)} = \frac{P_2}{N_2 (100 + G)} \quad \Rightarrow \quad N_2 = N_1 \cdot \frac{P_2}{P_1} \cdot \frac{100 - L}{100 + G}`,
      substitutionLatex: `N_2 = ${cfg.N1} \times \frac{${cfg.P2}}{${cfg.P1}} \times \frac{${100 - cfg.L}}{${100 + cfg.G}} = ${cfg.ans}\text{ lemons}`,
      optionEliminationTrick: `To turn a ${cfg.L}% loss into a ${cfg.G}% profit, he must give FEWER lemons per rupee! Multiply ${cfg.N1} × (${cfg.P2}/${cfg.P1}) × (${100 - cfg.L}/${100 + cfg.G}) = ${cfg.ans}!`,
      optionEliminationTrickHi: `एक-लाइन सूत्र: (रुपये ऊपर, वस्तु और प्रतिशत नीचे): (${cfg.P1}) / (${cfg.N1} × ${100 - cfg.L}) = (${cfg.P2}) / (N₂ × ${100 + cfg.G}) ⇒ N₂ = ${cfg.ans} नींबू!`,
      steps: [{
        title: 'Step 1: Equate Unit Cost Price Across Both Scenarios',
        titleHi: 'चरण 1: दोनों स्थितियों में 1 नींबू का क्रय मूल्य बराबर रखें',
        explanation: `Use Price / (Articles × %Factor) = Constant:`,
        explanationHi: `सूत्र P₁ / [N₁(100 - L)] = P₂ / [N₂(100 + G)] में मान रखने पर:`,
        latex: `\frac{${cfg.P1}}{${cfg.N1} \times ${100 - cfg.L}} = \frac{${cfg.P2}}{N_2 \times ${100 + cfg.G}} \quad \Rightarrow \quad N_2 = ${cfg.ans}`
      }],
      proTip: `Memorize "Rupees on Top, Articles × (100 ± %) on Bottom": R₁ / (N₁ · %₁) = R₂ / (N₂ · %₂)!`,
      proTipHi: `'रुपये ऊपर, वस्तु × प्रतिशत नीचे' ट्रिक से यह 2 मिनट का प्रश्न 10 सेकंड में हल होता है!`,
      diagram: {
        kind: 'work-bar',
        primaryValue: cfg.N1,
        secondaryValue: cfg.ans,
        labelA: `Old: ${cfg.N1} for ₹${cfg.P1}`,
        labelB: `New: ${cfg.ans} for ₹${cfg.P2}`,
        labelC: `N₂ = ${cfg.ans} Lemons (+${cfg.G}% Gain)`
      }
    };
  }

  // Sub-Type B: Discount + Successive Tax/GST (68th BPSC Q.143 Pattern)
  const MP = randomPick([400, 500, 800, 1000, 2000]);
  const rate = randomPick([10, 20]);
  const afterDisc = MP * (1 - rate / 100);
  const finalPrice = Math.round(afterDisc * (1 + rate / 100));
  const {
    options,
    correctOptionId
  } = buildShuffledOptions(`₹${finalPrice}`, [{
    text: `₹${MP}`,
    trapLabel: `Zero Net Change Illusion (Exact 68th BPSC Option A Trap!): Assumed -${rate}% discount and +${rate}% GST cancel out to ₹${MP}, whereas net change is -R²/100% (-${rate * rate / 100}%)!`
  }, {
    text: `₹${afterDisc}`,
    trapLabel: `Stopped After Discount Trap: Forgot to add the +${rate}% GST on the discounted price.`
  }, {
    text: `₹${MP + (MP - finalPrice)}`,
    trapLabel: `Added R²/100% instead of subtracting.`
  }]);
  return {
    variationId: makeVariationId('COM-B'),
    archetypeId: 'price-consumption',
    subTypeCode: 'B',
    subTypeTitle: 'Type B: Successive Discount & GST Trap (68th BPSC Q.143)',
    questionText: `A shopkeeper offers a ${rate}% discount on an item with Marked Price ₹${MP}. If he then charges ${rate}% GST on the discounted price, what is the final amount paid by the customer?`,
    questionTextHi: `एक दुकानदार ₹${MP} अंकित मूल्य वाली वस्तु पर ${rate}% की छूट देता है। यदि वह छूट के बाद के मूल्य पर ${rate}% GST लगाता है, तो ग्राहक को अंतिम रूप से कितने रुपये चुकाने होंगे?`,
    parameterBadges: [`68th BPSC Q.143 Verbatim`, `MP = ₹${MP}`, `-${rate}% then +${rate}% → -${rate * rate / 100}%`],
    options,
    correctOptionId,
    shortcutFormulaLatex: `\text{Final Price} = \text{MP} \times \left( 1 - \frac{R^2}{10000} \right)`,
    substitutionLatex: `\text{SP} = ${MP} \times \frac{${100 - rate}}{100} \times \frac{${100 + rate}}{100} = ${afterDisc} + ${finalPrice - afterDisc} = \text{₹}${finalPrice}`,
    optionEliminationTrick: `A -${rate}% discount followed by a +${rate}% tax NEVER brings the price back to ₹${MP}! It ALWAYS reduces the price by (R²/100)% = ${rate * rate / 100}%, so answer is ₹${finalPrice}!`,
    optionEliminationTrickHi: `-${rate}% छूट और +${rate}% टैक्स कभी बराबर होकर ₹${MP} नहीं होते! हमेशा R²/100% = ${rate * rate / 100}% की शुद्ध कमी होती है, अतः उत्तर ₹${finalPrice} होगा!`,
    steps: [{
      title: `Step 1: Apply ${rate}% Discount on ₹${MP}`,
      titleHi: `चरण 1: ₹${MP} पर ${rate}% छूट घटाएं`,
      explanation: `Discounted price = ₹${afterDisc}:`,
      explanationHi: `छूट के बाद मूल्य = ₹${afterDisc}:`,
      latex: `\text{Price}_1 = ${MP} - ${MP - afterDisc} = \text{₹}${afterDisc}`
    }, {
      title: `Step 2: Add ${rate}% GST on ₹${afterDisc}`,
      titleHi: `चरण 2: अब ₹${afterDisc} पर ${rate}% GST जोड़ें`,
      explanation: `${rate}% of ₹${afterDisc} is ₹${finalPrice - afterDisc}:`,
      explanationHi: `₹${afterDisc} का ${rate}% = ₹${finalPrice - afterDisc} जोड़ने पर:`,
      latex: `\text{Final Price} = ${afterDisc} + ${finalPrice - afterDisc} = \text{₹}${finalPrice}`
    }],
    proTip: `This exact same logic solves 69th BPSC Q.143 (Ramesh & Suresh 100 sq yd plot +10% then -10% → Ramesh ends with 99, Suresh with 101)!`,
    proTipHi: `यही सिद्धांत 69वीं BPSC Q.143 (रमेश-सुरेश 100 वर्ग गज प्लॉट +10% फिर -10% → रमेश=99, सुरेश=101) में भी लगता है!`,
    diagram: {
      kind: 'work-bar',
      primaryValue: finalPrice,
      secondaryValue: MP - finalPrice,
      labelA: `Final Paid: ₹${finalPrice}`,
      labelB: `Net Drop: -₹${MP - finalPrice}`,
      labelC: `MP ₹${MP} → ₹${afterDisc} → ₹${finalPrice}`
    }
  };
}

/**

    const configs = [{

      B: 64,
      diff: 17,
      sumTrap: 145
    }, {
      expr: '2^(6n) - 3^(3n)',
      A: 64,
      B: 27,
      diff: 37,
      sumTrap: 91
    }, {
      expr: '5^(3n) - 2^(6n)',
      A: 125,
      B: 64,
      diff: 61,

    const {
      options,

    } = buildShuffledOptions(`${cfg.diff}`, [{
      text: `${cfg.sumTrap}`,

  const se1 = randomPick([8, 9, 10, 11]);

  const laxmiPresent = 2 * (rahulPresent - 4) + 4;

    options,
    correctOptionId
  } = buildShuffledOptions(`${se1}, ${laxmiPresent}`, [{
    text: `${se1}, ${laxmiPresent - 4}`,

  }, {
    text: `${se1 + 1}, ${laxmiPresent}`,
    trapLabel: `Division Slip on Rahul's Present Age.`
  }, {
    text: `${se1}, ${2 * rahulPresent - 4}`,
    trapLabel: `Multiplied Present Age Instead of (Age - 4): Computed 2(${rahulPresent}) - 4 instead of 2(${rahulPresent} - 4) + 4.`
  }]);
  return {
    variationId: makeVariationId('AGE-71'),
    archetypeId: 'age-ratios',
    subTypeCode: 'A',
    subTypeTitle: 'Simultaneous Linear Age Chain (71st BPSC Q.8 Verbatim Pattern)',

    questionTextHi: `राहुल की आयु सीमा की आयु की 3 गुनी है। 4 वर्ष पूर्व लक्ष्मी की आयु राहुल की तत्कालीन आयु की दोगुनी थी। 4 वर्ष बाद राहुल की आयु ${rahulIn4} वर्ष होगी। सीमा और लक्ष्मी की वर्तमान आयु क्रमशः क्या है?`,
    parameterBadges: [`71st BPSC Q.8 Verbatim`, `Rahul_now = ${rahulIn4} - 4 = ${rahulPresent}`, `Seema = ${se1}`],
    options,
    correctOptionId,
    shortcutFormulaLatex: `R_0 = R_{+4} - 4, \quad S_0 = \frac{R_0}{3}, \quad L_0 = 2(R_0 - 4) + 4`,
    substitutionLatex: `R_0 = ${rahulPresent} \Rightarrow S_0 = ${se1}, \quad L_0 = 2(${rahulPresent - 4}) + 4 = ${laxmiPresent}`,
    optionEliminationTrick: `2-Second First-Number Check: Rahul now = ${rahulIn4} - 4 = ${rahulPresent}, so Seema now = ${rahulPresent} ÷ 3 = ${se1}! Immediately eliminate any option that doesn't start with ${se1}!`,
    optionEliminationTrickHi: `2-सेकंड ट्रिक: राहुल की वर्तमान आयु = ${rahulIn4} - 4 = ${rahulPresent} वर्ष ⇒ सीमा = ${rahulPresent}/3 = ${se1} वर्ष! फिर 4 वर्ष पूर्व राहुल = ${rahulPresent - 4}, लक्ष्मी = 2×${rahulPresent - 4} + 4 = ${laxmiPresent} वर्ष!`,
    steps: [{
      title: 'Step 1: Work Backwards from Rahul’s Future Age',
      titleHi: 'चरण 1: राहुल की भविष्य की आयु से वर्तमान आयु निकालें',
      explanation: `In 4 years Rahul is ${rahulIn4}, so Rahul today = ${rahulPresent} and Seema = ${rahulPresent}/3 = ${se1}:`,
      explanationHi: `राहुल आज = ${rahulIn4} - 4 = ${rahulPresent} वर्ष; सीमा आज = ${rahulPresent}/3 = ${se1} वर्ष:`,
      latex: `R_0 = ${rahulPresent}, \quad S_0 = ${se1}`
    }, {
      title: 'Step 2: Compute Laxmi’s Age 4 Years Ago & Add 4 for Present',
      titleHi: 'चरण 2: 4 वर्ष पूर्व लक्ष्मी की आयु निकालकर वर्तमान के लिए +4 जोड़ें',
      explanation: `4 years ago Rahul was ${rahulPresent - 4}, so Laxmi was 2 × ${rahulPresent - 4} = ${2 * (rahulPresent - 4)}. Today Laxmi is:`,
      explanationHi: `4 वर्ष पूर्व राहुल = ${rahulPresent - 4}, लक्ष्मी = ${2 * (rahulPresent - 4)}। अतः आज लक्ष्मी की आयु:`,
      latex: `L_0 = ${2 * (rahulPresent - 4)} + 4 = ${laxmiPresent}\text{ years}`
    }],
    proTip: `Always add back +4 to convert "age 4 years ago" to "present age"!`,
    proTipHi: `'4 वर्ष पूर्व की आयु' से 'वर्तमान आयु' में आने के लिए अंत में +4 जोड़ना कभी न भूलें!`,
    diagram: {

      labelA: `Seema = ${se1}y`,

      labelC: `Rahul Today = ${rahulPresent}y`
    }
  };
}
